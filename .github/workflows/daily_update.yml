name: daily_scraper

on:
  schedule:
    # ① 平日 JST 17:00 / 20:00 (UTC 08:00 / 11:00) -> 当月（勝負月・毎日2回）
    - cron: '0 8,11 * * 1-5'
    # ② 平日 JST 12:00 (UTC 03:00) -> 翌月（昼スロット・毎日1回）
    - cron: '0 3 * * 1-5'
    # ③ 毎日 JST 04:00 (UTC 19:00前日) -> 翌々月以降（深夜閑散時間帯・曜日別ローテーション）
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード (auto: 時刻判定 / current: 当月 / next: 翌月 / future: 曜日ローテーション)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - current
          - next
          - future
      rights:
        description: '特定権利月を指定する場合 (例: 2026-10 / 空欄ならmodeに従う)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Rotation Scraper
        run: |
          args=(--out-dir data)
          if [ -n "${{ inputs.rights }}" ]; then
            args+=(--rights "${{ inputs.rights }}")
          else
            mode="${{ inputs.mode }}"
            [ -z "$mode" ] && mode="auto"
            args+=(--mode "$mode")
          fi
          python run_rotation_scrape.py "${args[@]}"

      - name: Verify scraped data
        run: |
          python -c "
          import glob
          h = sorted(glob.glob('data/history_*.csv'))
          m = sorted(glob.glob('data/master_*.csv'))
          assert h and m, 'CSVが出力されていません'
          rows = {}
          for f in (h[-1], m[-1]):
              with open(f, encoding='utf-8-sig') as fp:
                  n = sum(1 for _ in fp) - 1
              print(f'{f}: {n}行')
              assert n > 0, f'{f} にデータ行がありません（取得失敗の可能性）'
              rows[f] = n
          "
          {
            echo "### スクレイピング結果"
            echo "- 最新history: \`$(ls -t data/history_*.csv | head -1)\`"
            echo "- 最新master: \`$(ls -t data/master_*.csv | head -1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and Push latest stock data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "変更なしのためpushをスキップします"
          else
            git commit -m "Auto update stock data: $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M') JST [skip ci]"
            git push
          fi
