name: daily_update

on:
  schedule:
    # 平日 JST 17:00 / 20:00 (UTC 08:00 / 11:00)
    - cron: '0 8,11 * * 1-5'
  workflow_dispatch:
    inputs:
      rights:
        description: '対象権利月 YYYY-MM (空欄で自動解決。year/monthより優先)'
        required: false
        default: ''
      year:
        description: '対象年 (例: 2026。monthと併用)'
        required: false
        default: ''
      month:
        description: '対象月 (例: 9。yearと併用)'
        required: false
        default: ''
      kengi:
        description: '権利付最終日 YYYY-MM-DD (空欄で自動算出)'
        required: false
        default: ''
      auto_watch:
        description: "新規行の監視自動ON条件 (例: yield>=1,funds<=30)"
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run updater
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          RIGHTS="${{ inputs.rights }}"
          if [ -z "$RIGHTS" ] && [ -n "${{ inputs.year }}" ] && [ -n "${{ inputs.month }}" ]; then
            RIGHTS="${{ inputs.year }}-$(printf '%02d' '${{ inputs.month }}')"
          fi
          ARGS=""
          [ -n "$RIGHTS" ] && ARGS="$ARGS --rights $RIGHTS"
          [ -n "${{ inputs.kengi }}" ] && ARGS="$ARGS --kengi ${{ inputs.kengi }}"
          [ -n "${{ inputs.auto_watch }}" ] && ARGS="$ARGS --auto-watch ${{ inputs.auto_watch }}"
          python main.py $ARGS
